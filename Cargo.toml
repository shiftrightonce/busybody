[package]
name = "busybody"
version = "1.0.17"
edition = "2024"
license = "MIT"
description = "Service Container and Dependency injector crate"
repository = "https://github.com/shiftrightonce/busybody"
keywords = ["webdev", "web", "service-container", "dependency-injection"]
categories = ["asynchronous", "web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures = "0.3.32"
async-trait = "0.1.89"
tokio = { version = "1.50.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
] }
ulid = "1"


[dev-dependencies]
tokio = { version = "1.52.1", features = ["full"] }
actix-web = { version = "4.13.0" }
rand = { version = "0.10.1" }
uuid = { version = "1.23.1", features = ["v4"] }
chrono = { version = "0.4.44" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.3", features = ["json"] }
axum = "0.8.9"
